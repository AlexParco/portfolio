server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # nginx corre detras de Traefik (TLS termina alli) y ve el request por http. Con
    # redirects relativos el navegador conserva el https original.
    absolute_redirect off;

    # Compresion. `gzip_proxied any` es necesario: el default (`off`) no comprime nada
    # que llegue a traves de un proxy, y aqui TODO llega a traves de Traefik.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Cabeceras de seguridad. OJO: `add_header` NO se hereda a un location que declare
    # el suyo (nginx reemplaza la lista entera), por eso se repiten abajo.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # SPA: las rutas (/projects/…, /notes/…, /about) no existen como archivo, las
    # resuelve React Router en el navegador. Lo que no es un archivo real cae en
    # index.html. index.html NO se cachea: es lo que apunta a los assets con hash, y si
    # se quedara viejo en la cache seguiria pidiendo un bundle anterior.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Assets de Vite: llevan hash de contenido en el nombre, asi que son inmutables.
    # Si un asset no existe, 404 de verdad: devolver index.html como si fuera un .js
    # daria un error de MIME confuso en vez de un 404 claro.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Archivos de public/ (hero.jpg, el CV, el favicon, el modelo del /lab): no llevan
    # hash, asi que una semana y no `immutable` — si se cambia la foto o el CV, se ve
    # como mucho a los 7 dias sin tener que renombrarlos.
    location ~* ^/[^/]+\.(jpg|png|svg|ico|pdf|glb)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
}
